<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Energy Management Dashboard</title>
  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; }
    h1 { text-align: center; color: #1a252f; }
    .grid { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); width: 180px; text-align: center; }
    .card h3 { margin: 0 0 10px 0; font-size: 13px; color: #7f8c8d; }
    .card p { margin: 0; font-size: 22px; font-weight: bold; color: #2c3e50; }
    #status-tag { font-size: 14px; padding: 6px 12px; border-radius: 5px; display: inline-block; font-weight: bold; }
    .status-ok { background: #2ecc71; color: white; }
    .status-warn { background: #f39c12; color: white; }
    .status-critical { background: #e74c3c; color: white; }
    .chart-box { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto; }
  </style>
</head>
<body>

  <h1>Smart Energy Management Dashboard</h1>

  <div class="grid">
    <div class="card"><h3>VOLTAGE</h3><p><span id="val-voltage">0</span> V</p></div>
    <div class="card"><h3>ACTIVE POWER</h3><p><span id="val-power">0</span> W</p></div>
    <div class="card"><h3>ENERGY LIMIT</h3><p><span id="val-limit">0</span> W</p></div>
    <div class="card"><h3>SYSTEM STATUS</h3><span id="status-tag" class="status-ok">NORMAL</span></div>
  </div>

  <div class="chart-box">
    <canvas id="powerChart"></canvas>
  </div>

  <script>
    const socket = io();
    const ctx = document.getElementById('powerChart').getContext('2d');
    const powerChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'Active Power (W)', borderColor: '#3498db', data: [], fill: false },
          { label: 'Energy Limit (W)', borderColor: '#e74c3c', borderDash: [5, 5], data: [], fill: false }
        ]
      },
      options: { responsive: true, scales: { y: { beginAtZero: true } } }
    });

    socket.on('telemetry_update', (data) => {
      document.getElementById('val-voltage').innerText = data.voltage;
      document.getElementById('val-power').innerText = data.power;
      document.getElementById('val-limit').innerText = data.limit;

      const tag = document.getElementById('status-tag');
      tag.innerText = data.status;
      tag.className = '';
      if (data.status.includes('CRITICAL')) tag.classList.add('status-critical');
      else if (data.status.includes('WARNING')) tag.classList.add('status-warn');
      else tag.classList.add('status-ok');

      if (powerChart.data.labels.length > 15) {
        powerChart.data.labels.shift();
        powerChart.data.datasets[0].data.shift();
        powerChart.data.datasets[1].data.shift();
      }

      powerChart.data.labels.push(data.timestamp);
      powerChart.data.datasets[0].data.push(data.power);
      powerChart.data.datasets[1].data.push(data.limit);
      powerChart.update();
    });
  </script>
</body>
</html>
